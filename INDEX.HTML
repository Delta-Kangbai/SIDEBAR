<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side_Bar Menu | CodingLab</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>
<body>
  <div class="main-box">
    <input type="checkbox" id="check">
    <div class="btn-one">
      <label for="check">
        <i><box-icon color="white" name="menu"></box-icon></i>
      </label>
    </div>
    <div class="sidebar-menu">
      <div class="logo">
        <a href="#">CodingLab</a>
      </div>
      <div class="btn-two">
        <label for="check">
          <i><box-icon name="x"></box-icon></i>
        </label>
      </div>
      <div class="menu">
       <ul style="list-style-type: none;">
        <li><i><a href="#"><box-icon color="white" name="qr"></box-icon>
          Dashboard</a></i></li>
        <li><i><a href="#"><box-icon color="white" name="link"></box-icon>
          Shortcuts</a></i></li>
        <li><i><a href="#"><box-icon color="white" name="grid-alt"></box-icon>
          Overview</a></i></li>
        <li><i><a href="#"><box-icon color="white" name="calendar"></box-icon>
          Events</a></i></li>
        <li> <i> <a href="#"><box-icon color="white" name="help-circle"></box-icon>
          About</a></i></li>
        <li> <i> <a href="#"><box-icon color="white" name="slider"></box-icon>
          Services</a></i></li>
        <li> <i> <a href="#"><box-icon color="white" name="phone-call"></box-icon>
          Contact</a> </i></li>
        <li> <i> <a href="#"><box-icon color="white" name="message"></box-icon>
          Feedback</a> </i></li>
       </ul>
       </div>
    <div class="social-media">
      <a href="#"> <i><box-icon color="white" type="logo" name="facebook-circle"></box-icon></a> </i>
      <a href="#"> <i> <box-icon color="white" type="logo" name="twitter"></box-icon></a> </i>
      <a href="#"> <i> <box-icon color="white" type="logo" name="instagram-alt"></box-icon></a></i>
      <a href="#"> <i> <box-icon color="white" type="logo" name="youtube"></box-icon></a></i>
    </div>
  </div>
</body>
</html>
